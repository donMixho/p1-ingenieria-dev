name: CI/CD Pipeline - Microservicio Tareas

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Pruebas Automatizadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: pytest tests/ --cov=app --cov-report=xml --cov-report=html --tb=short -v
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  quality-gate:
    name: Quality Gate - Cobertura Mínima 70%
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Calcular cobertura
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -q
      - name: Evaluar gate de cobertura (>= 70%)
        run: |
          UMBRAL=70
          COBERTURA=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100, 2))")
          echo "=================================================="
          echo "Cobertura total del proyecto: ${COBERTURA}%"
          echo "Umbral mínimo requerido:      ${UMBRAL}%"
          echo "=================================================="
          if python -c "import sys; sys.exit(0 if float('${COBERTURA}') >= ${UMBRAL} else 1)"; then
            echo "✅ QUALITY GATE PASADO: cobertura ${COBERTURA}% >= ${UMBRAL}%"
          else
            echo "❌ QUALITY GATE FALLIDO: cobertura ${COBERTURA}% < ${UMBRAL}%"
            exit 1
          fi

  security:
    name: Análisis de Seguridad (Snyk)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v7
      - uses: snyk/actions/python@master
        continue-on-error: false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical

  build:
    name: Build Imagen Docker
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target production -t p1-ingenieria-dev:${{ github.sha }} .

  deploy:
    name: Deploy Entorno Simulado
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y docker-compose
      - run: docker-compose up -d --build && sleep 15
      - run: curl -f http://localhost:8000/health || (docker-compose logs && exit 1)
      - run: docker-compose down
