version: "3.9"
services:
  app:
    build:
      context: .
      target: production
    image: p1-ingenieria-dev:latest
    container_name: microservicio_tareas
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
